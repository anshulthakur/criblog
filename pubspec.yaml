name: criblog
description: "Log your newborn's activities"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.2
  flutter_local_notifications: ^19.3.0
  shared_preferences: ^2.2.3
  timezone: ^0.10.1
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.0
  path_provider: ^2.1.2
  permission_handler: ^12.0.1
  device_info_plus: ^12.1.0
  path: ^1.9.0
  fl_chart: ^1.1.1
  home_widget: ^0.8.1  # For Android home screen widget
  workmanager: ^0.9.0+3
  google_sign_in: ^7.2.0
  googleapis: ^15.0.0
  googleapis_auth: ^2.0.0
  http: ^1.5.0
  json_annotation: ^4.9.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  json_serializable: ^6.11.1
  build_runner: ^2.10.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  image_path: "criblog.png"
  android: true
  ios: true